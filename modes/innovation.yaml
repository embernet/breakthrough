# Breakthrough mode: General innovation (TRIZ).
# Generic organisation & technology problems meet the 40 TRIZ inventive
# principles (names shortened to fit on a block).
# File format: see README.md, "Make your own mode".
id: innovation
name: General innovation (TRIZ)
description: Everyday organisation and technology problems meet the 40 TRIZ inventive principles.
solutionNoun: principle
solutionNounPlural: principles

problems:
  - label: Data silos
    note: Teams can't see each other's data.
