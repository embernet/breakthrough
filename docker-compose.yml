# Breakthrough: host deployment (dev or prod, chosen by .env).
#
#   cp .env.example .env        # dev defaults; prod's .env lives in ~/apps/breakthrough
#   docker compose up -d --build
#
# Defaults are the DEV instance (project breakthrough-dev, port 8195, ./data), so
# a fresh clone can never collide with prod. Prod (~/apps/breakthrough/.env) sets
# COMPOSE_PROJECT_NAME=breakthrough, BREAKTHROUGH_PORT=8190,
# BREAKTHROUGH_DATA_DIR=/data/apps/breakthrough.
name: ${COMPOSE_PROJECT_NAME:-breakthrough-dev}

services:
  app:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"   # host user, so the data dir stays theirs
    ports:
      - "${BREAKTHROUGH_PORT:-8195}:${BREAKTHROUGH_PORT:-8195}"
    environment:
      PORT: "${BREAKTHROUGH_PORT:-8195}"
      DATA_DIR: /data
      PUBLIC_URL: "${PUBLIC_URL:-}"
      PORTAL_URL: "${PORTAL_URL:-}"
      PORTAL_NAME: "${PORTAL_NAME:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      # Game mode shown by default (a modes/*.yaml id)
      DEFAULT_MODE: "${DEFAULT_MODE:-software-engineering}"
      # Login standard (shared auth module, src/auth/README.md)
      AUTH_LOCAL: "${AUTH_LOCAL:-on}"
      AUTH_SSO: "${AUTH_SSO:-off}"
      SSO_ISSUER: "${SSO_ISSUER:-https://tig-sso.grlab.co.uk/realms/tig}"
      SSO_CLIENT_ID: "${SSO_CLIENT_ID:-}"
      SSO_CLIENT_SECRET_FILE: "${SSO_CLIENT_SECRET_FILE:-}"
      LOCAL_ADMIN_USERS: "${LOCAL_ADMIN_USERS:-}"
      # trust the host's certificate store (e.g. newer roots an SSO issuer may chain to)
      NODE_USE_SYSTEM_CA: "1"
      SSO_ADMIN_GROUP: "${SSO_ADMIN_GROUP:-}"
      SSO_ADMIN_USERS: "${SSO_ADMIN_USERS:-}"
      SESSION_DAYS: "${SESSION_DAYS:-7}"
    volumes:
      - ${BREAKTHROUGH_DATA_DIR:-./data}:/data
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
