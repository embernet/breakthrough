# Breakthrough principle deck: the innovation principles carried by the
# falling solution pieces. These are the 40 TRIZ inventive principles, with
# names shortened to fit on a block (max 18 characters).
#
#   name:  shown on the piece and in the Innovation report
#   short: 2-4 letter tag drawn on settled blocks (optional, derived if missing)
#   hint:  one-line explanation shown when the principle solves a problem
#
# Override with DATA_DIR/decks/principles.yaml.
name: TRIZ inventive principles
principles:
  - { number: 1, name: Segmentation, short: SEG, hint: "Divide it into independent or modular parts." }
  - { number: 2, name: Taking out, short: OUT, hint: "Separate out the troublesome part, or keep only the useful one." }
  - { number: 3, name: Local quality, short: LOC, hint: "Make each part fit its own local conditions." }
  - { number: 4, name: Asymmetry, short: ASY, hint: "Replace symmetry with deliberate imbalance." }
  - { number: 5, name: Merging, short: MRG, hint: "Bring identical or related things or operations together." }
  - { number: 6, name: Universality, short: UNI, hint: "Make one part do several jobs." }
  - { number: 7, name: Nesting, short: NST, hint: "Place one thing inside another." }
  - { number: 8, name: Anti-weight, short: AWT, hint: "Offset a burden by pairing it with something that lifts it." }
  - { number: 9, name: Counter in advance, short: PCA, hint: "Take early action to cancel a known harm." }
  - { number: 10, name: Prior action, short: PRI, hint: "Do the required work before it is needed." }
  - { number: 11, name: Cushion in advance, short: CSH, hint: "Prepare fallbacks for the parts likely to fail." }
  - { number: 12, name: Equipotentiality, short: EQP, hint: "Remove the need to raise or lower things; level the path." }
  - { number: 13, name: Do it in reverse, short: REV, hint: "Invert the action, the process or the order." }
  - { number: 14, name: Spheroidality, short: CRV, hint: "Swap straight lines and steps for curves and rotation." }
  - { number: 15, name: Dynamics, short: DYN, hint: "Let characteristics change to stay optimal." }
  - { number: 16, name: Partial action, short: PRT, hint: "If 100% is hard, do a bit less or a bit more." }
  - { number: 17, name: Another dimension, short: DIM, hint: "Move into a new plane, layer or axis." }
  - { number: 18, name: Vibration, short: VIB, hint: "Add oscillation or rhythm; increase its frequency." }
  - { number: 19, name: Periodic action, short: PER, hint: "Replace continuous action with pulses." }
  - { number: 20, name: Continuous action, short: CON, hint: "Keep useful work flowing without idle time." }
  - { number: 21, name: Rush through, short: RSH, hint: "Pass through the harmful stage at high speed." }
  - { number: 22, name: Harm into benefit, short: HRM, hint: "Use a harmful factor to get a positive effect." }
  - { number: 23, name: Feedback, short: FBK, hint: "Introduce or improve feedback loops." }
  - { number: 24, name: Intermediary, short: MED, hint: "Use a go-between to carry or transfer the action." }
  - { number: 25, name: Self-service, short: SLF, hint: "Make it serve and maintain itself." }
  - { number: 26, name: Copying, short: CPY, hint: "Use a simple, cheap copy instead of the original." }
  - { number: 27, name: Cheap disposables, short: DSP, hint: "Replace one expensive thing with many cheap ones." }
  - { number: 28, name: Replace mechanics, short: MEC, hint: "Swap a manual or mechanical means for a smarter field." }
  - { number: 29, name: Fluid systems, short: FLU, hint: "Use flexible, fluid parts instead of rigid ones." }
  - { number: 30, name: Flexible shells, short: SHL, hint: "Isolate with thin, flexible membranes." }
  - { number: 31, name: Porous materials, short: POR, hint: "Add holes and channels; let things flow through." }
  - { number: 32, name: Colour changes, short: COL, hint: "Change visibility or transparency to reveal what matters." }
  - { number: 33, name: Homogeneity, short: HOM, hint: "Make interacting parts of the same kind." }
  - { number: 34, name: Discard & recover, short: DIS, hint: "Let parts vanish after use, or restore them in place." }
  - { number: 35, name: Parameter changes, short: PAR, hint: "Change state, concentration, flexibility or scale." }
  - { number: 36, name: Phase transitions, short: PHS, hint: "Exploit what happens as things change state." }
  - { number: 37, name: Thermal expansion, short: THM, hint: "Use expansion or contraction under changing conditions." }
  - { number: 38, name: Boost interactions, short: BST, hint: "Enrich the environment to speed up reactions." }
  - { number: 39, name: Inert atmosphere, short: INR, hint: "Create a neutral, calm environment around the work." }
  - { number: 40, name: Composites, short: CMP, hint: "Combine different materials for a better whole." }
